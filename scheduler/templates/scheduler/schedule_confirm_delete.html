<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Study Session - Study Schedule Manager</title>
</head>
<body>

    <h1>Study Schedule Manager</h1>
    <h2>Delete Study Session</h2>

    <p>Are you sure you want to delete "{{ schedule.subject }} - {{ schedule.topic }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
    </form>

    <p><a href="{% url 'home' %}">Cancel</a></p>

</body>
</html>
